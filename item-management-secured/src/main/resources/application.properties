
# Server Configuration
server.port=9092

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/item_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Keycloak JWT Configuration
#POST http://localhost:9091/realms/item-management/protocol/openid-connect/token
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9091/realms/item-management
