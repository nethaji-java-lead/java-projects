spring.application.name=payment-micro-service
server.port = 8086

spring.datasource.url=jdbc:postgresql://localhost:5433/paymentdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.kafka.topics.order-created=order.created

#Kafka Config

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer


payment.gateway.base-url=http://localhost:8089
payment.gateway.timeout-ms=3000
payment.retry.max-attempts=3
payment.retry.initial-backoff-ms=1000


# Demo fault injection; disabled by default
payment.demo.scenario=crash

spring.kafka.listener.ack-mode=record
