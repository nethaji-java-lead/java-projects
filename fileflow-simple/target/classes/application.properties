server.port=8081
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/fileflow
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

fileflow.storage.type=sftp
fileflow.storage.sftp.host=localhost
fileflow.storage.sftp.port=2222
fileflow.storage.sftp.user=demo
fileflow.storage.sftp.password=demo
fileflow.storage.sftp.known-hosts=./known_hosts

fileflow.storage.sftp.root=/upload
