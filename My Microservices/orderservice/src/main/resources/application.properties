# ==========================================
# Server
# ==========================================

server.port=9091

spring.application.name=order-service


# ==========================================
# Kafka
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=order-service

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.consumer.properties.spring.json.type.mapping=com.example.paymentservice.event.PaymentCreatedEvent:com.example.orderservice.event.PaymentCreatedEvent


# ==========================================
# H2 Database
# ==========================================

spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=pass


# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ==========================================
# H2 Console
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console