services:

  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 4

      #/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list

      #/opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic order.created.DLT --from-beginning --property print.key=true --property print.timestamp=true

  payment-gateway:
    image: wiremock/wiremock:3.13.1
    command: [ "--global-response-templating" ]
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8089/__admin/health" ]
      interval: 10s
      timeout: 3s
      retries: 5

  email-provider:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped